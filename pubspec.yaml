name: waha_client
description: Waha customer app (online ordering + on-site shopping-mode via a customer's own phone) — web, Android, Linux
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  http: ^1.2.0
  provider: ^6.1.2
  uuid: ^4.4.0
  mobile_scanner: ^5.2.3
  shared_preferences: ^2.2.3
  path_provider: ^2.1.5
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.0
  audioplayers: ^6.0.0
  webview_flutter: ^4.10.0
  webview_flutter_web: ^0.2.3+4
  cached_network_image: ^4.0.0
  package_info_plus: ^9.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/sounds/
